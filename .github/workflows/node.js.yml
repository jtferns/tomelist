name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Read-only by default. Deploying to Workers needs only the Cloudflare secrets.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the pre-push commit, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn vp check
      - run: yarn test
      - run: yarn build
      - name: fallow audit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Same steps as fallow-rs/fallow's Action: analyse once to JSON, then render annotations and the job summary.
        run: |
          status=0
          yarn fallow audit --base "$BASE" --format json > fallow-audit.json || status=$?
          yarn fallow report --from fallow-audit.json --format github-annotations
          yarn fallow report --from fallow-audit.json --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  e2e:
    runs-on: ubuntu-latest
    # Browsers and their system deps ship in the image, so no `playwright install` step.
    # Dependabot doesn't bump this tag: the guard below fails when it drifts from @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: Playwright image matches @playwright/test
        run: |
          pinned=$(node -p "require('./app/package.json').devDependencies['@playwright/test']")
          image=$(grep -oE 'mcr.microsoft.com/playwright:v[0-9.]+' .github/workflows/node.js.yml | head -1 | sed 's/.*:v//')
          if [ "$pinned" != "$image" ]; then
            echo "::error::Playwright image v$image does not match @playwright/test $pinned. Update the container tag."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
