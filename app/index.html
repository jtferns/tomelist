<!doctype html>
<html lang="en" data-theme="dark" data-palette="maelstrom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tomelist</title>
    <link rel="icon" type="image/png" href="/tomes/2026-09-astronomy-first-hunt.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var palettes = ["maelstrom", "adder", "flames"];
          var modes = ["dark", "light"];
          var ornaments = ["full", "reduced", "minimal"];
          var densities = ["comfy", "compact"];
          var raw = localStorage.getItem("tomelist:v2");
          var theme = (raw && JSON.parse(raw).state.settings.theme) || {};
          var palette = palettes.indexOf(theme.palette) !== -1 ? theme.palette : "maelstrom";
          var mode = modes.indexOf(theme.mode) !== -1 ? theme.mode : "dark";
          var ornament = ornaments.indexOf(theme.ornament) !== -1 ? theme.ornament : "full";
          var density = densities.indexOf(theme.density) !== -1 ? theme.density : "comfy";
          document.documentElement.dataset.theme = mode;
          document.documentElement.dataset.palette = palette;
          document.documentElement.dataset.ornament = ornament;
          document.documentElement.dataset.density = density;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
